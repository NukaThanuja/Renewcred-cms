services:
  # Express Backend Service (100% Free Plan)
  - type: web
    name: renewcred-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free

  # Next.js Frontend Service (100% Free Plan)
  - type: web
    name: renewcred-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: renewcred-backend
          property: host
