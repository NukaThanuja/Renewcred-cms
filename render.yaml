services:
  # Express Backend Service (100% Free Plan)
  - type: web
    name: renewcred-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true

  # Next.js Frontend Service (100% Free Plan)
  - type: web
    name: renewcred-frontend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: renewcred-backend
          property: host
