services:
  # Express Backend Service with Persistent Storage
  - type: web
    name: renewcred-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: cms-data
      mountPath: /app/database
      sizeGB: 1

  # Next.js Frontend Service
  - type: web
    name: renewcred-frontend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: renewcred-backend
          property: url
          suffix: /api
